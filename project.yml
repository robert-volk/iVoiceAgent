name: VoiceAgent
options:
  bundleIdPrefix: com.robertvolk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  VoiceAgent:
    build:
      targets:
        VoiceAgent: all
    run:
      config: Release
    archive:
      config: Release

targets:
  VoiceAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      # App-icon PNGs are deliberately NOT declared as XcodeGen resources
      # here. CFBundleIconFiles (Info.plist) needs them at the bundle's
      # top level, but neither a bare folder path (a folder REFERENCE,
      # which preserves subfolder structure on copy) nor listing each
      # file individually actually landed them there in practice -- two
      # attempts, two failures, confirmed by CI's own verification step.
      # Rather than keep guessing at XcodeGen/Xcode resource-declaration
      # syntax with no way to compile-test locally, the CI workflow copies
      # these PNGs directly into the built .app with a plain `cp` after
      # xcodebuild finishes -- see ios-build.yml, which has zero ambiguity
      # about where they end up.
    # Use our hand-maintained Info.plist verbatim. Do NOT use XcodeGen's `info:`
    # directive here — it regenerates (overwrites) the file and strips custom
    # keys like NSMicrophoneUsageDescription, which makes iOS crash on mic access.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertvolk.voiceagent
        PRODUCT_NAME: VoiceAgent
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"

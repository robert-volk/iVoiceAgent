name: VoiceAgent
options:
  bundleIdPrefix: com.robertvolk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  VoiceAgent:
    build:
      targets:
        VoiceAgent: all
    run:
      config: Release
    archive:
      config: Release

targets:
  VoiceAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      # Loose app-icon PNGs copied to the bundle root, referenced by
      # CFBundleIconFiles in Info.plist. This legacy method reliably shows the
      # home-screen icon for sideloaded (AltStore) builds, unlike the asset
      # catalog app icon which wasn't being embedded (see iVoice).
      - path: Resources/AppIcons
    # Use our hand-maintained Info.plist verbatim. Do NOT use XcodeGen's `info:`
    # directive here — it regenerates (overwrites) the file and strips custom
    # keys like NSMicrophoneUsageDescription, which makes iOS crash on mic access.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertvolk.voiceagent
        PRODUCT_NAME: VoiceAgent
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"

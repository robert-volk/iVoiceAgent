name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-15 ships Xcode 16, which can read the project format (objectVersion 77)
    # produced by the current XcodeGen release.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen (from official release, no Homebrew)
        run: |
          set -euo pipefail
          curl -fSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          XG_BIN="$(find xcodegen-dist -type f -name xcodegen -path '*/bin/*' | head -1)"
          echo "Found XcodeGen at: $XG_BIN"
          "$XG_BIN" --version
          echo "XCODEGEN_BIN=$XG_BIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml

      - name: List schemes
        run: xcodebuild -list -project VoiceAgent.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          # CURRENT_PROJECT_VERSION overridden to the run number so every
          # build is genuinely distinct -- project.yml's checked-in value
          # never changes, and a static build number across sideload
          # updates is a known trigger for iOS/AltStore to keep serving a
          # cached app icon instead of picking up a new one.
          xcodebuild \
            -project VoiceAgent.xcodeproj \
            -scheme VoiceAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean build

      - name: Verify app icon landed at the bundle root
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/VoiceAgent.app"
          # CFBundleIconFiles (Info.plist) only looks at the bundle's top
          # level -- it does not search subdirectories. A prior version of
          # project.yml pointed at Resources/AppIcons as a bare folder
          # path, which XcodeGen turned into a folder REFERENCE that
          # preserves the subfolder structure on copy, silently landing
          # these one level too deep and leaving every build with no
          # visible home-screen icon at all. Fail loudly instead of
          # shipping that silently again.
          missing=0
          for f in AppIcon60x60@2x.png AppIcon60x60@3x.png AppIcon40x40@2x.png AppIcon40x40@3x.png \
                   AppIcon29x29@2x.png AppIcon29x29@3x.png AppIcon20x20@2x.png AppIcon20x20@3x.png; do
            if [ ! -f "$APP_PATH/$f" ]; then
              echo "MISSING at bundle root: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "App icon PNGs did not land at the bundle root -- see project.yml resources."
            echo "Bundle contents for debugging:"
            find "$APP_PATH" -maxdepth 2
            exit 1
          fi
          echo "All app icon files present at bundle root."

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VoiceAgent.app"
          if [ ! -d "$APP_PATH" ]; then echo "App not found at $APP_PATH"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VoiceAgent-unsigned.ipa Payload
          echo "Built IPA:"; ls -lh VoiceAgent-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAgent-unsigned-ipa
          path: VoiceAgent-unsigned.ipa
          if-no-files-found: error
